<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }
      .pulse-node-delayed {
        animation: pulse 3s infinite ease-in-out 1.5s;
      }
      .rotate-ring {
        transform-origin: 1050px 200px;
        animation: rotateRing 20s linear infinite;
      }
      .rotate-ring-reverse {
        transform-origin: 1050px 200px;
        animation: rotateRingRev 15s linear infinite;
      }
      .glow-line {
        stroke-dasharray: 200;
        stroke-dashoffset: 400;
        animation: dash 4s linear infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateRingRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Dynamic Digital Twin Mesh Graphic (Right Side) -->
  <g class="rotate-ring">
    <circle cx="1050" cy="200" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4" />
    <polygon points="1050,70 1162,265 938,265" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" />
  </g>
  
  <g class="rotate-ring-reverse">
    <circle cx="1050" cy="200" r="95" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
    <polygon points="1050,330 938,135 1162,135" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Central Digital Twin Core Node -->
  <circle cx="1050" cy="200" r="25" fill="#00f2fe" opacity="0.8" filter="url(#glow)" class="pulse-node" />
  <circle cx="1050" cy="200" r="10" fill="#ffffff" />

  <!-- Connecting Lines -->
  <path d="M 650 200 L 950 200 M 800 120 L 1050 200 M 800 280 L 1050 200" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6" class="glow-line" />

  <!-- Outer Satellite Nodes -->
  <circle cx="950" cy="200" r="8" fill="#38bdf8" class="pulse-node-delayed" />
  <circle cx="800" cy="120" r="8" fill="#818cf8" class="pulse-node" />
  <circle cx="800" cy="280" r="8" fill="#34d399" class="pulse-node-delayed" />

  <!-- Left Header Content -->
  <g transform="translate(70, 0)">
    <!-- Category Badge -->
    <rect x="0" y="65" width="280" height="32" rx="16" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" opacity="0.9" />
    <text x="140" y="86" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">⚡ AWESOME PLATFORM LIST</text>

    <!-- Main Title -->
    <text x="0" y="155" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Simulation &amp; Digital Twin</text>
    <text x="0" y="205" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" filter="url(#glow)">Technology Stack</text>

    <!-- Subtitle / Meta -->
    <text x="0" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Physics Models · Industrial IoT · Asset Intelligence · 3D Metaverses
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="15" y="23" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">🌐 Commercial</text>

      <rect x="155" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="170" y="23" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700">⚡ Open Source</text>

      <rect x="310" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="325" y="23" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="700">📊 Benchmarks</text>
    </g>
  </g>
</svg>

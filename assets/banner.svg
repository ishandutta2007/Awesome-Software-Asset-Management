<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Animated Accent Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Layer Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Animated Floating Nodes / Glow Orbs -->
  <circle cx="200" cy="100" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="100;120;100" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.25;0.15" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="1000" cy="300" r="160" fill="#7c3aed" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="300;280;300" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Asset Network Lines -->
  <path d="M 100 320 L 350 320 L 450 250 L 750 250 L 850 320 L 1100 320" fill="none" stroke="url(#text-gradient)" stroke-width="2" opacity="0.6" filter="url(#soft-glow)">
    <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="5s" repeatCount="indefinite" />
  </path>
  
  <path d="M 200 80 L 400 80 L 500 150 L 700 150 L 800 80 L 1000 80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Central Title Text Group -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Subtitle Category Badge -->
    <rect x="-170" y="-115" width="340" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="-93" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
      SOFTWARE ASSET MANAGEMENT
    </text>

    <!-- Main Title -->
    <text x="0" y="-20" fill="url(#text-gradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#soft-glow)">
      Awesome SAM Ecosystem
    </text>

    <!-- Subtitle Line -->
    <text x="0" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" letter-spacing="0.5">
      Software License Tracking • SaaS Management • Compliance • ITAM
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 80)">
      <!-- Pill 1 -->
      <rect x="-270" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="-250" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-235" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">Enterprise SaaS</text>

      <!-- Pill 2 -->
      <rect x="-90" y="0" width="180" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="-70" cy="16" r="5" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="-55" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">Open-Source ITAM</text>

      <!-- Pill 3 -->
      <rect x="110" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="130" cy="16" r="5" fill="#a855f7">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="145" y="21" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">FinOps & Compliance</text>
    </g>
  </g>
</svg>

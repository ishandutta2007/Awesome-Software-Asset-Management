<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a11"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Card Styling -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.7" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1" fill="#4b5563" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatFast {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 4px; opacity: 0.6; }
      50% { r: 7px; opacity: 1; }
    }

    .glow-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .glow-orb-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .float-card-1 { animation: floatSlow 5s ease-in-out infinite; }
    .float-card-2 { animation: floatFast 6s ease-in-out infinite 1s; }
    .float-card-3 { animation: floatSlow 7s ease-in-out infinite 0.5s; }
    .animated-line { stroke-dasharray: 8 6; animation: dashStream 15s linear infinite; }
    .pulse-node { animation: nodePulse 3s ease-in-out infinite; }
  </style>

  <!-- Base Layer Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Ambient Glow Orbs -->
  <circle class="glow-orb-1" cx="200" cy="100" r="180" fill="#6366f1" filter="url(#soft-glow)"/>
  <circle class="glow-orb-2" cx="1000" cy="300" r="200" fill="#06b6d4" filter="url(#soft-glow)"/>
  <circle cx="600" cy="200" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#soft-glow)"/>

  <!-- Tech Grid Background -->
  <rect width="1200" height="400" fill="url(#grid)" rx="16"/>

  <!-- Decorative Connecting Mesh Network -->
  <g opacity="0.45">
    <line x1="100" y1="80" x2="250" y2="160" stroke="#6366f1" stroke-width="1.5" class="animated-line"/>
    <line x1="250" y1="160" x2="180" y2="300" stroke="#8b5cf6" stroke-width="1.5" class="animated-line"/>
    <line x1="950" y1="100" x2="1050" y2="220" stroke="#06b6d4" stroke-width="1.5" class="animated-line"/>
    <line x1="1050" y1="220" x2="920" y2="320" stroke="#10b981" stroke-width="1.5" class="animated-line"/>
    
    <!-- Pulse Nodes -->
    <circle cx="100" cy="80" r="5" fill="#6366f1" class="pulse-node"/>
    <circle cx="250" cy="160" r="4" fill="#8b5cf6"/>
    <circle cx="180" cy="300" r="6" fill="#ec4899" class="pulse-node"/>
    <circle cx="950" cy="100" r="5" fill="#06b6d4" class="pulse-node"/>
    <circle cx="1050" cy="220" r="4" fill="#3b82f6"/>
    <circle cx="920" cy="320" r="5" fill="#10b981" class="pulse-node"/>
  </g>

  <!-- Left Side Dynamic Feature Cards -->
  <g class="float-card-1" filter="url(#shadow)" transform="translate(50, 75)">
    <rect width="220" height="92" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5"/>
    <rect x="15" y="19" width="50" height="54" rx="10" fill="url(#cyan-grad)" opacity="0.2"/>
    <g transform="translate(26, 32)" stroke="#06b6d4" stroke-width="2" fill="none">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </g>
    <text x="78" y="39" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">SaaS &amp; Cloud</text>
    <text x="78" y="57" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Discovery &amp; Metering</text>
    <circle cx="195" cy="25" r="4" fill="#10b981"/>
  </g>

  <g class="float-card-2" filter="url(#shadow)" transform="translate(30, 230)">
    <rect width="220" height="92" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5"/>
    <rect x="15" y="19" width="50" height="54" rx="10" fill="url(#emerald-grad)" opacity="0.2"/>
    <g transform="translate(27, 32)" stroke="#10b981" stroke-width="2" fill="none">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="m9 12 2 2 4-4"/>
    </g>
    <text x="78" y="39" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Audit Defense</text>
    <text x="78" y="57" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">License Compliance</text>
    <circle cx="195" cy="25" r="4" fill="#10b981"/>
  </g>

  <!-- Right Side Dynamic Feature Cards -->
  <g class="float-card-3" filter="url(#shadow)" transform="translate(930, 75)">
    <rect width="220" height="92" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5"/>
    <rect x="15" y="19" width="50" height="54" rx="10" fill="url(#primary-grad)" opacity="0.2"/>
    <g transform="translate(28, 32)" stroke="#8b5cf6" stroke-width="2" fill="none">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="14"/>
    </g>
    <text x="78" y="39" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">FinOps &amp; ROI</text>
    <text x="78" y="57" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cost Optimization</text>
    <circle cx="195" cy="25" r="4" fill="#6366f1"/>
  </g>

  <g class="float-card-1" filter="url(#shadow)" transform="translate(950, 230)">
    <rect width="220" height="92" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5"/>
    <rect x="15" y="19" width="50" height="54" rx="10" fill="url(#amber-grad)" opacity="0.2"/>
    <g transform="translate(28, 32)" stroke="#f59e0b" stroke-width="2" fill="none">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </g>
    <text x="78" y="39" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Entitlements</text>
    <text x="78" y="57" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated Tracking</text>
    <circle cx="195" cy="25" r="4" fill="#f59e0b"/>
  </g>

  <!-- Center Content Area -->
  <!-- Header Pill Badge -->
  <g transform="translate(600, 68)">
    <rect x="-145" y="-18" width="290" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
    <circle cx="-120" cy="-1" r="5" fill="#10b981" class="pulse-node"/>
    <text x="-100" y="4" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ENTERPRISE ITAM &amp; SAM ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 152)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primary-grad)">Software Asset Management</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 198)">
    <text x="0" y="0" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      A curated, audit-ready index of Commercial SAM Platforms &amp; Open-Source Tools
    </text>
  </g>

  <!-- Feature Pills Row -->
  <g transform="translate(600, 262)">
    <!-- Tag 1 -->
    <g transform="translate(-235, 0)">
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="72" y="20" text-anchor="middle" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">💼 SaaS Platforms</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-75, 0)">
      <rect x="0" y="0" width="150" height="32" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="75" y="20" text-anchor="middle" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🔓 Open-Source Tools</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="72" y="20" text-anchor="middle" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🛡️ Compliance &amp; SCA</text>
    </g>
  </g>

  <!-- Bottom Accent Line & Subtext -->
  <g transform="translate(600, 335)">
    <line x1="-280" y1="0" x2="280" y2="0" stroke="url(#primary-grad)" stroke-width="2" opacity="0.6"/>
    <circle cx="-280" cy="0" r="3" fill="#6366f1"/>
    <circle cx="0" cy="0" r="4" fill="#8b5cf6" class="pulse-node"/>
    <circle cx="280" cy="0" r="3" fill="#ec4899"/>
    <text x="0" y="24" text-anchor="middle" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="1">
      UPDATED FOR 2026 • COMMUNITY MAINTAINED
    </text>
  </g>
</svg>

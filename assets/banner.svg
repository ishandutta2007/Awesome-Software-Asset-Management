<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Animation -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#311042;#1e1b4b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 1.5px; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; letter-spacing: 1px; }

    @keyframes pulse {
      0% { r: 6px; opacity: 0.8; }
      50% { r: 12px; opacity: 0.3; }
      100% { r: 6px; opacity: 0.8; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .sync-line { stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6, 6; animation: dash 4s linear indefinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Animated Synchronization Lines -->
  <path class="sync-line" d="M 250 200 Q 400 120 600 200 T 950 200" fill="none" />
  <path class="sync-line" d="M 250 200 Q 450 280 600 200 T 950 200" fill="none" stroke="#ec4899" />

  <!-- Animated Glowing Nodes -->
  <circle cx="250" cy="200" r="8" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="600" cy="200" r="10" fill="#a855f7" filter="url(#glow)" />
  <circle cx="950" cy="200" r="8" fill="#10b981" filter="url(#glow)" />

  <!-- Content Group -->
  <g transform="translate(600, 180)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-160" y="-105" width="320" height="34" rx="17" fill="url(#pill-grad)" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="-83" class="badge-text">VACATION RENTAL OPS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="-20" class="title" filter="url(#glow)">Awesome Short-Term Rental Operations</text>

    <!-- Subtitle -->
    <text x="0" y="30" class="subtitle">PMS • Channel Management • Automated Messaging • Smart Access</text>

    <!-- Tech Tags / Features -->
    <g transform="translate(0, 75)" font-family="system-ui" font-size="13" font-weight="600">
      <rect x="-240" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="-175" y="19" fill="#38bdf8" text-anchor="middle">🏠 Multi-Calendar</text>

      <rect x="-90" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="-35" y="19" fill="#a855f7" text-anchor="middle">🔑 Smart Lock</text>

      <rect x="35" y="0" width="105" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="87.5" y="19" fill="#10b981" text-anchor="middle">🧹 Turno Ops</text>

      <rect x="155" y="0" width="105" height="28" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="207.5" y="19" fill="#f43f5e" text-anchor="middle">⚡ Open-Source</text>
    </g>
  </g>
</svg>

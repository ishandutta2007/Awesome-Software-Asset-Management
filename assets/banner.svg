<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#0f172a;#1e1b4b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#311b92">
        <animate attributeName="stop-color" values="#311b92;#1e1b4b;#311b92" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 52px; font-weight: 800; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 22px; font-weight: 400; fill: #94a3b8; }
    .badge { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #38bdf8; }
    .node-text { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Glow -->
  <circle cx="600" cy="200" r="300" fill="url(#glow)">
    <animate attributeName="r" values="250;350;250" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Grid / Nodes -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="400" stroke="#6366f1" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="400" stroke="#6366f1" stroke-width="1" />
    <line x1="500" y1="0" x2="500" y2="400" stroke="#6366f1" stroke-width="1" />
    <line x1="700" y1="0" x2="700" y2="400" stroke="#6366f1" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="400" stroke="#6366f1" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="400" stroke="#6366f1" stroke-width="1" />
  </g>

  <!-- Floating School Component Orbit Nodes -->
  <!-- Student SIS Node -->
  <g transform="translate(180, 110)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text text-anchor="middle" y="5" class="node-text">🎓 Student SIS</text>
    <animateTransform attributeName="transform" type="translate" values="180,110; 180,100; 180,110" dur="4s" repeatCount="indefinite" />
  </g>

  <!-- Education ERP Node -->
  <g transform="translate(1020, 110)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <text text-anchor="middle" y="5" class="node-text">🏫 School ERP</text>
    <animateTransform attributeName="transform" type="translate" values="1020,110; 1020,120; 1020,110" dur="5s" repeatCount="indefinite" />
  </g>

  <!-- Parent Portal Node -->
  <g transform="translate(180, 300)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
    <text text-anchor="middle" y="5" class="node-text">👨‍👩‍👧 Parent Portal</text>
    <animateTransform attributeName="transform" type="translate" values="180,300; 180,310; 180,300" dur="4.5s" repeatCount="indefinite" />
  </g>

  <!-- LMS Integration Node -->
  <g transform="translate(1020, 300)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <text text-anchor="middle" y="5" class="node-text">📚 LMS &amp; Exams</text>
    <animateTransform attributeName="transform" type="translate" values="1020,300; 1020,290; 1020,300" dur="5.5s" repeatCount="indefinite" />
  </g>

  <!-- Central Title Header -->
  <g transform="translate(600, 175)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-140" y="-95" width="280" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text y="-74" class="badge">🚀 SAAS &amp; OPEN-SOURCE ECOSYSTEM</text>
    
    <!-- Main Title -->
    <text class="title" y="-10">Awesome School Management</text>

    <!-- Subtitle -->
    <text class="subtitle" y="45">Student Information Systems • School ERP • Academic Management</text>
  </g>

  <!-- Bottom Dynamic Pulsating Status Bar -->
  <g transform="translate(600, 345)" text-anchor="middle">
    <rect x="-260" y="-16" width="520" height="32" rx="8" fill="#1e293b" opacity="0.9" stroke="#475569" stroke-width="1" />
    <circle cx="-230" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
      Curated Comparison of Enterprise SaaS Platforms &amp; Self-Hosted Repos
    </text>
  </g>
</svg>
